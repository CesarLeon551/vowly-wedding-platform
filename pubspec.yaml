name: boda_app
description: "WebApp de gestión integral de boda — presupuesto, invitados, RSVP, proveedores, música colaborativa (Spotify) y más."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado / navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Modelos inmutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Red / Spotify API
  dio: ^5.7.0

  # Utilidades
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
